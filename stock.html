h+='<!--M:market--><div class="c"><h2>시세 (눌러서 선택)</h2>';
A.forEach(x=>{const p=g.prices[x.id],pv=g.prev[x.id],ch=(p/pv-1)*100;h+='<div class="mk '+(x.id===sel?'on':'')+'" onclick="sel=\''+x.id+'\';chart=\''+x.id+'\';R()"><div><b>'+x.n+'</b><div class="mu">'+x.t+'</div></div><div>'+P(p)+'</div><div class="'+(ch>=0?'up':'dn')+'">'+(ch>=0?'▲':'▼')+Math.abs(ch).toFixed(2)+'%</div>'+spark(g.hist[x.id].slice(-40),p>=g.hist[x.id][0])+'</div>'});
h+='</div>';
const nws=g.news||[];h+='<!--M:news--><div class="c"><h2>📰 지난 갱신 뉴스 · 등락 이유 ('+g.n*TICK/60+'분 시점)</h2><div style="max-height:340px;overflow:auto">'+(nws.length?nws.map(x=>'<div style="padding:6px;border-top:1px solid var(--bd);'+(x.id===sel?'background:var(--bg);border-radius:8px':'')+'"><b class="'+(x.ch>=0?'up':'dn')+'">'+(x.ch>=0?'▲':'▼')+Math.abs(x.ch).toFixed(1)+'%</b> <b>'+nm(x.id)+'</b><div class="mu">'+x.t+'</div></div>').join(''):'<div class="mu">첫 갱신 후 종목별 뉴스가 표시됩니다.</div>')+'</div></div>';
const it=(g.intel||{})[sel];h+=`<!--M:intel--><div class='c'><h2>🔮 다음 소식 정보</h2><select onchange='sel=this.value;R()' style='margin-bottom:8px'>${A.map(x=>`<option value='${x.id}' ${x.id===sel?'selected':''}>${x.n}</option>`).join('')}</select><div class='mu' style='margin-bottom:8px'>다음 갱신 때 주가에 영향을 줄 소식을 미리 살 수 있습니다. 갱신되면 정보는 사라집니다.</div>${it?`<div style='padding:8px;border-radius:8px;background:var(--bg)'>${it.lv===2?`<b class='${it.up?'up':'dn'}'>${it.up?'▲ 상승 예상':'▼ 하락 예상'}</b> ${it.t}`:`<b>개요</b> ${it.o}`}</div>`:''}<div class='r' style='margin-top:8px'><button class='s' onclick='buyInfo(1)' ${it?'disabled':''}>개요 보기 (50만원)</button><button class='s p' onclick='buyInfo(2)' ${it&&it.lv===2?'disabled':''}>정확한 소식 (${it?'250':'300'}만원)</button></div></div>`;
h+='<!--M:buy--><div class="c"><h2>매수 · '+a.n+' ('+P(g.prices[sel])+')</h2><div class="r" style="margin-bottom:8px">';
const lv=LV.includes(sel)?lev:1;(LV.includes(sel)?[1,2,3,4]:[1]).forEach(l=>h+='<button class="s '+(lv===l?'on':'')+'" onclick="lev='+l+';R()">'+(l===1?'현물':'레버리지 '+l+'배')+'</button>');
h+='</div>'+(LV.includes(sel)?'':'<div class="mu" style="margin-bottom:8px">레버리지는 삼별 전자, ks로우닉스 전자만 가능합니다.</div>')+(lv>1?'<div class="mu" style="margin-bottom:8px">⚠ 가격이 '+(100/lv).toFixed(1)+'% 하락하면 증거금 전액이 청산됩니다.</div>':'');
h+='<div class="mx"><input type="number" inputmode="numeric" placeholder="투자금(원)" value="'+inp+'" oninput="inp=this.value"><button class="p" onclick="buy()">매수</button></div><div class="r" style="margin-top:8px">';
[.1,.25,.5,1].forEach(p=>h+='<button class="s" onclick="setPct('+p+')">'+p*100+'%</button>');h+='</div></div>';
h+='<!--M:pos--><div class="c"><h2>보유 포지션</h2>';
if(!g.pos.length)h+='<div class="mu">보유 중인 포지션이 없습니다.</div>';
g.pos.forEach((o,i)=>{const v=eq(o),pl=(v/o.m-1)*100;h+='<div class="r sp" style="padding:6px 0;border-top:1px solid var(--bd)"><div><b>'+nm(o.id)+'</b> '+(o.l>1?'x'+o.l:'현물')+'<div class="mu">진입 '+P(o.e)+' · 투자 '+W(o.m)+'</div></div><div class="r"><div style="text-align:right"><b>'+W(v)+'</b><div class="'+(pl>=0?'up':'dn')+'">'+(pl>=0?'+':'')+pl.toFixed(1)+'%</div></div><button class="s" onclick="sell('+i+')">정산</button></div></div>'});
h+='</div>';
const cdn=i=>Math.max(0,Math.ceil((((g.cd||{})[i]||0)-Date.now())/1000));h+=`<!--M:job--><div class='c'><h2>💼 알바 센터</h2><div class='mu'>미니게임으로 현금을 벌 수 있어요. 알바마다 60초 쿨타임이 있고, 잘할수록 더 법니다.</div></div>${JOB.map((j,i)=>`<div class='c'><div class='r sp'><div><div style='font-size:32px'>${j.i}</div><b>${j.n}</b><div class='mu'>${j.d}</div></div><button class='p' ${cdn(i)?'disabled':''} onclick='job(${i})'>${cdn(i)?cdn(i)+'초 후 가능':'일하러 가기'}</button></div></div>`).join('')}`;
h+='<!--M:corp-->'+corpPage();h+='<!--M:loan-->'+loanPage();h+='<!--M:bond-->'+bondPage();
h+='<!--M:log--><div class="c"><h2>기록</h2>'+g.log.map(l=>'<div class="mu">· '+l+'</div>').join('')+'</div>';return h}
let mg=null,mgT=null,tab=0;
const TABS=['시세·매매','뉴스·정보','알바','회사','은행','채권','기록'];
function go(i){tab=i;R()}
const JOB=[{i:'🏪',n:'편의점 알바',d:'30초간 계산 맞히기, 정답당 +5천원 / 오답 −3천원, 시간 −2초'},{i:'🏗️',n:'공사장 막노동',d:'10초간 망치질, 1번당 800원'},{i:'🛵',n:'배달 알바',d:'타이밍 5번, 최대 6만원'}];
const ITEM=[['🥤 음료',1500],['🍙 삼각김밥',1200],['🍫 과자',1800],['🍜 컵라면',1700],['🍞 빵',2300],['🧃 주스',1300]];
function job(i){const g=S.game;if(mg)return;g.cd=g.cd||{};const w=Math.ceil(((g.cd[i]||0)-Date.now())/1000);if(w>0){log(JOB[i].n+' 쿨타임 '+w+'초 남음');R();return}
mg={i,pay:0,ok:0,miss:0,hit:0,r:0,pos:0,dir:1,msg:'',end:Date.now()+(i===0?30000:10000)};if(i===0)mq();mgR();clearInterval(mgT);mgT=setInterval(mgTick,40)}
function mq(){const n=2+Math.floor(Math.random()*2),it=[];let s=0;for(let k=0;k<n;k++){const x=ITEM[Math.floor(Math.random()*ITEM.length)];it.push(x);s+=x[1]}const o=[s];while(o.length<3){const v=s+(Math.random()<.5?-1:1)*100*(1+Math.floor(Math.random()*9));if(v>0&&!o.includes(v))o.push(v)}o.sort(()=>Math.random()-.5);mg.q={it,s,o}}
function mgAns(k){if(!mg||mg.done)return;if(mg.q.o[k]===mg.q.s){mg.ok++;mg.pay+=5000}else{mg.miss++;mg.pay=Math.max(0,mg.pay-3000);mg.end-=2000}mq();mgR()}
function mgHit(){if(!mg||mg.done)return;mg.hit++;mg.pay+=800;document.getElementById('mgc').textContent=mg.hit;document.getElementById('mgp').textContent=X(mg.pay)}
function mgStop(){if(!mg||mg.done)return;const d=Math.abs(mg.pos-50),gain=d<=8?12000:d<=22?6000:0;mg.pay+=gain;if(gain)mg.ok++;mg.msg=gain===12000?'완벽! +12,000원':gain?'굿! +6,000원':'아쉽! 0원';mg.r++;if(mg.r>=5){mgEnd();return}mg.pos=0;mg.dir=1;mgR()}
function mgTick(){if(!mg||mg.done){clearInterval(mgT);return}if(mg.i<2){const l=Math.max(0,(mg.end-Date.now())/1000),e=document.getElementById('mgt');if(e)e.textContent=l.toFixed(1)+'초';if(l<=0)mgEnd()}else{mg.pos+=mg.dir*(1.6+mg.r*.6);if(mg.pos>=100){mg.pos=100;mg.dir=-1}if(mg.pos<=0){mg.pos=0;mg.dir=1}const m=document.getElementById('mgm');if(m)m.style.left=mg.pos+'%'}}
function mgEnd(){clearInterval(mgT);const g=S.game;mg.done=true;if(g){g.cash+=mg.pay;g.cd=g.cd||{};g.cd[mg.i]=Date.now()+60000;log(JOB[mg.i].n+' +'+W(mg.pay));save()}mg.note=mg.i===0?mg.ok+'번 정확히 계산, '+mg.miss+'번 실수':mg.i===1?mg.hit+'번 망치질':mg.ok+'/5번 성공';mgR();R()}
function mgClose(){mg=null;mgR()}
function mgR(){const el=document.getElementById('mg');if(!mg){el.innerHTML='';return}const J=JOB[mg.i];let b;
if(mg.done)b=`<div style='font-size:40px'>${J.i}</div><h2>${J.n} 끝!</h2><div class='big'>+${X(mg.pay)}</div><div class='mu' style='margin:6px 0 12px'>${mg.note}</div><button class='p' onclick='mgClose()'>확인</button>`;
else if(mg.i===0)b=`<h2>${J.i} ${J.n}</h2><div class='mu'>남은 시간 <b id='mgt'></b> · 정답 ${mg.ok}개 · 번 돈 ${X(mg.pay)}</div><div style='margin:14px 0;font-size:16px'>${mg.q.it.map(x=>x[0]+' '+x[1].toLocaleString('ko-KR')+'원').join(' + ')}<br>합계는?</div><div class='r' style='justify-content:center'>${mg.q.o.map((v,k)=>`<button class='p' onclick='mgAns(${k})'>${v.toLocaleString('ko-KR')}원</button>`).join('')}</div>`;
else if(mg.i===1)b=`<h2>${J.i} ${J.n}</h2><div class='mu'>남은 시간 <b id='mgt'></b></div><div class='big' style='margin:10px 0'><span id='mgc'>${mg.hit}</span>번 · <span id='mgp'>${X(mg.pay)}</span></div><button class='p' style='font-size:22px;padding:22px 34px' onclick='mgHit()'>🔨 망치질!</button>`;
else b=`<h2>${J.i} ${J.n}</h2><div class='mu'>${mg.r+1}/5번째 · 초록 구간 한가운데서 멈추세요</div><div style='position:relative;height:28px;background:var(--bd);border-radius:8px;margin:18px 0'><div style='position:absolute;left:28%;width:44%;top:0;bottom:0;background:rgba(52,199,89,.35)'></div><div style='position:absolute;left:42%;width:16%;top:0;bottom:0;background:rgba(52,199,89,.7)'></div><div id='mgm' style='position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--tx);border-radius:3px;left:${mg.pos}%'></div></div><div class='mu' style='margin-bottom:10px'>${mg.msg||'&nbsp;'} · 번 돈 ${X(mg.pay)}</div><button class='p' style='font-size:20px;padding:16px 30px' onclick='mgStop()'>멈춰!</button>`;
el.innerHTML=`<div class='ov' style='z-index:20'><div class='c'>${b}</div></div>`}
function bigChart(id){const g=S.game,h=g.hist[id],a=A.find(x=>x.id===id),Wd=640,H=300,L=62,B=24,T=10,mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1,n=Math.max(h.length-1,1),X=i=>L+i/n*(Wd-L-10),Y=v=>T+(H-T-B)*(1-(v-mn)/r),f=v=>v.toLocaleString('ko-KR',{maximumFractionDigits:v<1000?1:0}),first=h[0],last=h[h.length-1],col=last>=first?'var(--up)':'var(--dn)',ch=(last/first-1)*100,nn=(g.news||[]).find(x=>x.id===id);
let gr='';for(let k=0;k<=4;k++){const v=mn+r*k/4,y=Y(v);gr+=`<line x1='${L}' x2='${Wd-10}' y1='${y}' y2='${y}' stroke='var(--bd)'/><text x='${L-6}' y='${y+4}' text-anchor='end' font-size='11' fill='var(--mu)'>${f(v)}</text>`}
const pts=h.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
return `<div class='ov' onclick='chart=null;R()'><div class='c' style='max-width:700px;width:100%;text-align:left;margin:0' onclick='event.stopPropagation()'><div class='r sp'><h2 style='margin:0'>${a.n} <span class='mu'>${a.t}</span></h2><button class='s' onclick='chart=null;R()'>닫기 ✕</button></div><div class='r' style='margin:8px 0'><b style='font-size:20px'>${P(last)}</b><b class='${ch>=0?'up':'dn'}'>${ch>=0?'▲':'▼'}${Math.abs(ch).toFixed(2)}% (시작가 대비)</b></div><svg viewBox='0 0 ${Wd} ${H}' style='width:100%;height:auto'>${gr}<polyline fill='none' stroke='${col}' stroke-width='2' points='${pts}'/><text x='${L}' y='${H-6}' font-size='11' fill='var(--mu)'>0분</text><text x='${Wd-10}' y='${H-6}' text-anchor='end' font-size='11' fill='var(--mu)'>${(h.length-1)*TICK/60}분</text></svg><div class='mu' style='margin-top:6px'>시작 ${P(first)} · 최고 ${P(mx)} · 최저 ${P(mn)}</div>${nn?`<div style='margin-top:8px'>📰 ${nn.t}</div>`:''}</div></div>`}
function R(){if(!S.game)chart=null;let h=S.game?game():menu();if(chart)h+=bigChart(chart);if(msg)h+='<div class="ov"><div class="c"><h1>'+msg.t+'</h1><div style="white-space:pre-line;text-align:left;line-height:1.6;max-height:60vh;overflow:auto;margin-bottom:14px">'+msg.b+'</div><button class="p" onclick="msg=null;R()">확인</button></div></div>';document.getElementById('app').innerHTML=h}
setInterval(()=>{if(!S.game||msg)return;S.game.left--;corpTick();if(S.game.left<=0)tick();else{const e=document.getElementById('tm');if(e)e.textContent=tf(S.game.left);if((tab===2||(tab===3&&!(S.game.corp&&S.game.corp.stage===1)))&&!mg&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))R()}},1000);
if(S.game&&!S.game.left)S.game.left=TICK;
if(S.game){if(!S.game.next)S.game.next=rollNext();S.game.intel=S.game.intel||{};if(S.game.cs===undefined)S.game.cs=600;if(!S.game.loans){S.game.loans=S.game.debt>0?[{bk:1,pk:1,p:S.game.debt,bal:S.game.debt,age:1}]:[];sd(S.game)}}
R();
</script></body></html>
